<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QUIZ MASTER – Luyện tập trắc nghiệm</title>
  <meta name="description" content="Hệ thống luyện tập trắc nghiệm thông minh: trắc nghiệm A/B/C/D và Đúng/Sai.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232563eb'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <!-- Font hỗ trợ tiếng Việt (nếu không tải được sẽ dùng font hệ thống) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Đường dẫn tương đối: chạy được với Live Server và GitHub Pages -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#" id="brand-link" aria-label="QUIZ MASTER – về trang chủ">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26"><path d="M9 16.5l4.5 4.5L23 11.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">QUIZ MASTER</span>
          <span class="brand-tagline">Hệ thống luyện tập trắc nghiệm thông minh</span>
        </span>
      </a>
      <div class="total-chip" title="Tổng số câu hỏi">
        <span class="total-num" id="total-count">0</span>
        <span class="total-label">câu hỏi</span>
      </div>
    </div>
  </header>

  <main class="container" id="app" tabindex="-1">
    <noscript><p class="notice">Trang web cần bật JavaScript để hoạt động.</p></noscript>
  </main>

  <footer class="site-footer container">
    <span>Tiến độ được lưu ngay trên trình duyệt của bạn.</span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Dữ liệu câu hỏi phải được nạp trước app.js -->
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
